api_health:
    path: /api/health
    controller: App\Controller\ApiController::health
    methods: [GET]

api_inventory:
    path: /api/spools
    controller: App\Controller\ApiController::inventory
    methods: [GET]

api_inventory_aggregated:
    path: /api/spools/aggregated
    controller: App\Controller\ApiController::inventoryAggregated
    methods: [GET]

api_brands:
    path: /api/brands
    controller: App\Controller\ApiController::brands
    methods: [GET]

api_materials:
    path: /api/materials
    controller: App\Controller\ApiController::materials
    methods: [GET]

api_spool_by_nfc:
    path: /api/spools/nfc/{uid}
    controller: App\Controller\ApiController::spoolByNfc
    methods: [GET]

api_usage_create:
    path: /api/usage-logs
    controller: App\Controller\ApiController::createUsage
    methods: [POST]

api_spool_create:
    path: /api/spools
    controller: App\Controller\ApiController::createSpool
    methods: [POST]

api_spool_update:
    path: /api/spools/{id}
    controller: App\Controller\ApiController::updateSpool
    methods: [PUT, PATCH]

api_spool_delete:
    path: /api/spools/{id}
    controller: App\Controller\ApiController::deleteSpool
    methods: [DELETE]

api_stats_materials:
    path: /api/stats/materials
    controller: App\Controller\ApiController::statsByMaterial
    methods: [GET]

api_stats_projects:
    path: /api/stats/projects
    controller: App\Controller\ApiController::statsByProject
    methods: [GET]

api_stats_monthly:
    path: /api/stats/monthly
    controller: App\Controller\ApiController::statsByMonth
    methods: [GET]

api_auth_register:
    path: /api/auth/register
    controller: App\Controller\AuthController::register
    methods: [POST]

api_auth_login:
    path: /api/auth/login
    controller: App\Controller\AuthController::login
    methods: [POST]

api_auth_logout:
    path: /api/auth/logout
    controller: App\Controller\AuthController::logout
    methods: [POST]

api_auth_change_password:
    path: /api/auth/change-password
    controller: App\Controller\AuthController::changePassword
    methods: [POST]
