    methods: [GET]

api_brand_create:
    path: /api/brands
    controller: App\Controller\ApiController::createBrand
    methods: [POST]

api_brand_delete:
    path: /api/brands/{id}
    controller: App\Controller\ApiController::deleteBrand
    methods: [DELETE]

api_materials:
    path: /api/materials
    controller: App\Controller\ApiController::materials
